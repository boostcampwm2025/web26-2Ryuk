name: CD - Deploy to NCP

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_IMAGE_NAME }}-backend
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_IMAGE_NAME }}-frontend
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/project' }}
  API_PORT: ${{ secrets.API_PORT }}
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
  JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
  BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
  MEDIASOUP_ANNOUNCED_IP: ${{ secrets.NCP_HOST }}
  MEDIASOUP_RTC_MIN_PORT: ${{ secrets.MEDIASOUP_RTC_MIN_PORT }}
  MEDIASOUP_RTC_MAX_PORT: ${{ secrets.MEDIASOUP_RTC_MAX_PORT }}
  GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Copy infra files to NCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.NCP_SSH_PORT }}
          timeout: 60s
          command_timeout: 300s
          source: infra/
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: SSH into NCP and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.NCP_SSH_PORT }}
          timeout: 60s
          command_timeout: 300s
          script_stop: true

          envs: >
            DOCKER_USERNAME,
            DOCKER_PASSWORD,
            DOCKER_IMAGE_BACKEND,
            DOCKER_IMAGE_FRONTEND,
            DOCKER_IMAGE_TAG,
            DEPLOY_PATH,
            API_PORT,
            MEDIASOUP_ANNOUNCED_IP,
            MEDIASOUP_RTC_MIN_PORT,
            MEDIASOUP_RTC_MAX_PORT,
            MEDIASOUP_LISTEN_IP,
            GITHUB_CLIENT_ID,
            GITHUB_CLIENT_SECRET,
            JWT_ACCESS_SECRET,
            JWT_ACCESS_EXPIRES_IN,
            JWT_REFRESH_SECRET,
            JWT_REFRESH_EXPIRES_IN,
            FRONTEND_URL,
            BACKEND_BASE_URL,
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,
            DB_USERNAME,
            DB_PASSWORD,
            DB_NAME,
            DB_ROOT_PASSWORD

          script: |
            set -e
            echo "[INFO] Connected to server"

            cd "${DEPLOY_PATH:-~/project}"

            export DOCKER_IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"

            echo "[INFO] Deploy path: $(pwd)"
            echo "[INFO] Image tag: $DOCKER_IMAGE_TAG"

            chmod +x infra/deploy.sh
            infra/deploy.sh

        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ env.DOCKER_PASSWORD }}
          DOCKER_IMAGE_BACKEND: ${{ env.DOCKER_IMAGE_BACKEND }}
          DOCKER_IMAGE_FRONTEND: ${{ env.DOCKER_IMAGE_FRONTEND }}
          DOCKER_IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          API_PORT: ${{ env.API_PORT }}
          MEDIASOUP_ANNOUNCED_IP: ${{ env.MEDIASOUP_ANNOUNCED_IP }}
          MEDIASOUP_RTC_MIN_PORT: ${{ env.MEDIASOUP_RTC_MIN_PORT }}
          MEDIASOUP_RTC_MAX_PORT: ${{ env.MEDIASOUP_RTC_MAX_PORT }}
          MEDIASOUP_LISTEN_IP: '0.0.0.0'
          GITHUB_CLIENT_ID: ${{ env.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ env.GITHUB_CLIENT_SECRET }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ env.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN: ${{ env.JWT_REFRESH_EXPIRES_IN }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          BACKEND_BASE_URL: ${{ env.BACKEND_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}

      - name: Notify Success
        if: success()
        run: |
          echo "Deploy succeeded"
          echo "Tag: ${{ steps.tag.outputs.IMAGE_TAG }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "Deploy failed"
          echo "Tag: ${{ steps.tag.outputs.IMAGE_TAG }}"
