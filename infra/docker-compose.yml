services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    ports:
      - "3306:3306"
    networks:
      - eryuk_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - eryuk_net
    restart: unless-stopped

  api:
    image: ${DOCKER_USERNAME}/${DOCKER_IMAGE_BACKEND}:${DOCKER_IMAGE_TAG:-latest}
    container_name: server
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-4000}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_PORT=${API_PORT:-4000}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - MEDIASOUP_RTC_MIN_PORT=${MEDIASOUP_RTC_MIN_PORT}
      - MEDIASOUP_RTC_MAX_PORT=${MEDIASOUP_RTC_MAX_PORT}
      - MEDIASOUP_LISTEN_IP=${MEDIASOUP_LISTEN_IP}
      - MEDIASOUP_WORKER_NUM=${MEDIASOUP_WORKER_NUM:-auto}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
      - "${MEDIASOUP_RTC_MIN_PORT:-20000}-${MEDIASOUP_RTC_MAX_PORT:-20020}:${MEDIASOUP_RTC_MIN_PORT:-20000}-${MEDIASOUP_RTC_MAX_PORT:-20020}/udp"
      - "${MEDIASOUP_RTC_MIN_PORT:-20000}-${MEDIASOUP_RTC_MAX_PORT:-20020}:${MEDIASOUP_RTC_MIN_PORT:-20000}-${MEDIASOUP_RTC_MAX_PORT:-20020}/tcp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eryuk_net
    restart: unless-stopped

  client:
    image: ${DOCKER_USERNAME}/${DOCKER_IMAGE_FRONTEND}:${DOCKER_IMAGE_TAG:-latest}
    container_name: client
    environment:
      - NODE_ENV=production
    expose:
      - '${CLIENT_PORT:-3000}'
    depends_on:
      api:
        condition: service_started
    networks:
      - eryuk_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api
      - client
    ports:
      - '${NGINX_HTTP_PORT:-80}:${NGINX_HTTP_PORT:-80}'
      - '${NGINX_HTTPS_PORT:-443}:${NGINX_HTTPS_PORT:-443}'
    volumes:
      - ./nginx/certs/fullchain.crt:/etc/nginx/ssl/fullchain.crt:ro
      - ./nginx/certs/private.key:/etc/nginx/ssl/private.key:ro
      - ./nginx/certs/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      API_HOST: api
      API_PORT: ${API_PORT:-4000}
      CLIENT_HOST: client
      CLIENT_PORT: ${CLIENT_PORT:-3000}
    command: /bin/sh -c "envsubst '$$API_HOST $$API_PORT $$CLIENT_HOST $$CLIENT_PORT' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    networks:
      - eryuk_net
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:

networks:
  eryuk_net:
    driver: bridge
